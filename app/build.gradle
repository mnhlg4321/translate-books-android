        'PROMPT_DAU_CHAT_3_LUOT_V5_SAFE_4.txt': '0B4C02573F46A91528A63262D3E52C655A5C7E31F2ABBBFB01759D38E94F8E81',
        'WORKFLOW_BIEN_TAP_3_LUOT_V5_SAFE_4.txt': '7A434ADE77239DB33AF5A677456D0310AC11DC8391565FC4888236536FF96B5E'
]
def editorialSafe4Root = file('src/main/assets/editorial/v5-safe4')
def editorialV5FullFiles = [
        'PROJECT_INSTRUCTION_BIEN_TAP_V5_SAFE_4_1_3_FULL.txt': '1727AE173F2CFD530EB818CAE69E0D3FADC59C35E3B5B6D478704A02091A26AD',
        'PROMPT_DAU_CHAT_3_LUOT_V5_SAFE_4_1_3_FULL.txt': 'D25757D1A6BDDD5962A3B178B9EF850727573AE0C34867EC8F4B8450C7CD754F',
        'WORKFLOW_BIEN_TAP_3_LUOT_V5_SAFE_4_1_3_FULL.txt': '5DB6B4F6509313F106499113537D2880BC6D2FF663859239DAFB285557505730'
]
def editorialV5FullRoot = file('src/main/assets/editorial/v5-safe4-full-chatgpt')
def editorialEngineProfileSourceRoot = rootProject.file('editorial-engine/src/main/resources/editorial/engine-profile')
def editorialEngineProfileAssetRoot = layout.buildDirectory.dir('generated/editorial-engine-profile-assets')
def editorialEngineProfileFiles = ['v1/profile.json', 'v2/profile.json']

def syncEditorialEngineProfileAsset = tasks.register('syncEditorialEngineProfileAsset', Sync) {
    group = 'verification'
    description = 'Copies engine-owned trusted profile resources into the APK asset set.'
    from(editorialEngineProfileSourceRoot)
    into(editorialEngineProfileAssetRoot)
    inputs.files(editorialEngineProfileFiles.collect { new File(editorialEngineProfileSourceRoot, it) })
    outputs.dir(editorialEngineProfileAssetRoot)
}

def verifyEditorialEngineProfileAsset = tasks.register('verifyEditorialEngineProfileAsset') {
    group = 'verification'
    description = 'Requires every APK asset copy of a trusted profile to match its engine-owned source bytes.'
    dependsOn syncEditorialEngineProfileAsset
    doLast {
        editorialEngineProfileFiles.each { relativePath ->
            def source = new File(editorialEngineProfileSourceRoot, relativePath)
            def bundled = editorialEngineProfileAssetRoot.get().file(relativePath).asFile
            if (!source.isFile() || !bundled.isFile()
                    || !java.util.Arrays.equals(source.bytes, bundled.bytes)) {
                throw new GradleException("Bundled trusted engine profile bytes differ for ${relativePath}.")
            }
        }
    }
}

android.sourceSets.main.assets.srcDir(editorialEngineProfileAssetRoot)
// test doubles shared by the JVM tests and the instrumented tests (never part of the app)
android.sourceSets.test.java.srcDir("src/sharedTest/java")
android.sourceSets.androidTest.java.srcDir("src/sharedTest/java")

def verifyEditorialSafe4Pack = tasks.register('verifyEditorialSafe4Pack') {
    group = 'verification'
    description = 'Requires the bundled V5-SAFE.4 workflow pack to match its immutable source hashes.'
    inputs.files(editorialSafe4Files.keySet().collect { new File(editorialSafe4Root, it) })
    doLast {
        editorialSafe4Files.each { name, expected ->
            def source = new File(editorialSafe4Root, name)
            if (!source.isFile()) throw new GradleException("SAFE 4 workflow source is missing: ${source}")
            def actual = java.security.MessageDigest.getInstance('SHA-256').digest(source.bytes)
                    .collect { String.format('%02X', it & 0xff) }.join()
            if (actual != expected) {
                throw new GradleException("SAFE 4 workflow hash mismatch for ${name}. Expected ${expected}, found ${actual}.")
            }
        }
    }
}

def verifyEditorialV5FullPack = tasks.register('verifyEditorialV5FullPack') {
    group = 'verification'
    description = 'Requires the bundled V5-SAFE.4.1.3 FULL ChatGPT pack to match its immutable source hashes.'
    inputs.files(editorialV5FullFiles.keySet().collect { new File(editorialV5FullRoot, it) })
    doLast {
        editorialV5FullFiles.each { name, expected ->
            def source = new File(editorialV5FullRoot, name)
            if (!source.isFile()) throw new GradleException("V5 FULL ChatGPT pack file is missing: ${source}")
            def actual = java.security.MessageDigest.getInstance('SHA-256').digest(source.bytes)
                    .collect { String.format('%02X', it & 0xff) }.join()
            if (actual != expected) {
                throw new GradleException("V5 FULL ChatGPT pack hash mismatch for ${name}. Expected ${expected}, found ${actual}.")
            }
        }
    }
}

def verifyApprovedLogo = tasks.register('verifyApprovedLogo') {
    group = 'verification'
    description = 'Requires every app build to use the approved Translate Books logo.'
    inputs.files(approvedLogoFile, approvedManifestFile, approvedHeaderFile)
    doLast {
        if (!approvedLogoFile.isFile()) {
            throw new GradleException("Approved logo is missing: ${approvedLogoFile}")
        }
        def digest = java.security.MessageDigest.getInstance('SHA-256').digest(approvedLogoFile.bytes)
        def actualSha256 = digest.collect { String.format('%02X', it & 0xff) }.join()
        if (actualSha256 != approvedLogoSha256) {
            throw new GradleException(
                "Approved logo hash mismatch. Expected ${approvedLogoSha256}, found ${actualSha256}."
            )
        }
        def manifestText = approvedManifestFile.getText('UTF-8')
        if (!manifestText.contains('android:icon="@drawable/translate_books_logo"')
                || !manifestText.contains('android:roundIcon="@drawable/translate_books_logo"')) {
            throw new GradleException('AndroidManifest.xml must use the approved logo for icon and roundIcon.')
        }
        def headerText = approvedHeaderFile.getText('UTF-8')
        if (!headerText.contains('setImageResource(R.drawable.translate_books_logo)')) {
            throw new GradleException('The in-app top brand badge must use the approved logo.')
        }
    }
}

tasks.named('preBuild').configure {
    dependsOn verifyApprovedLogo
    dependsOn verifyEditorialSafe4Pack
    dependsOn verifyEditorialV5FullPack
    dependsOn verifyEditorialEngineProfileAsset
}
