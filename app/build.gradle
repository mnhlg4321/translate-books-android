plugins {
    id 'com.android.application'
}

def isVersionedBuild = providers.gradleProperty('versionedBuild').orElse('false').get().toBoolean()
def resolvedVersionCode = providers.gradleProperty('buildVersionCode').orElse('48').get().toInteger()
def resolvedVersionName = providers.gradleProperty('buildVersionName').orElse('4.13-p0-dev').get()
def resolvedBuildEventId = providers.gradleProperty('buildEventId').orElse('unarchived-development').get()
def resolvedBuildGitCommit = providers.gradleProperty('buildGitCommit').orElse('52fb24c (P0 translation-core hotfix)').get()
def resolvedBuildTimestamp = providers.gradleProperty('buildTimestamp').orElse('2026-07-17 +07:00').get()

def quoteBuildConfigString = { String value ->
    '"' + value.replace('\\', '\\\\').replace('"', '\\"') + '"'
}

android {
    namespace 'com.ml.tblandroidtxt'
    compileSdk 35

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    defaultConfig {
        applicationId 'com.ml.tblandroidtxt'
        minSdk 26
        targetSdk 35
        versionCode resolvedVersionCode
        versionName resolvedVersionName
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        buildConfigField 'String', 'BUILD_EVENT_ID', quoteBuildConfigString(resolvedBuildEventId)
        buildConfigField 'String', 'BUILD_GIT_COMMIT', quoteBuildConfigString(resolvedBuildGitCommit)
        buildConfigField 'String', 'BUILD_TIMESTAMP', quoteBuildConfigString(resolvedBuildTimestamp)
    }

    buildTypes {
        benchmark {
            initWith release
            signingConfig signingConfigs.debug
            matchingFallbacks = ['release']
            debuggable false
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "TranslateBooks-v${variant.versionName}-${variant.buildType.name}.apk"
        }
    }
}

gradle.taskGraph.whenReady { graph ->
    def assemblesDebugApk = graph.allTasks.any { it.path == ':app:assembleDebug' }
    if (assemblesDebugApk && !isVersionedBuild) {
        throw new GradleException(
            'Unarchived debug builds are disabled. Run .\\scripts\\build-and-save.ps1 so the APK, README, checksum, and source snapshot are retained before optional installation.'
        )
    }
}

dependencies {
    implementation project(':editorial-engine')
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    benchmarkImplementation 'androidx.profileinstaller:profileinstaller:1.4.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20250517'
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
}

def approvedLogoSha256 = '104D17792425810F4E7419BFEA268505DECA6148D04C7AC852D646245CD61797'
def approvedLogoFile = file('src/main/res/drawable-nodpi/translate_books_logo.png')
def approvedManifestFile = file('src/main/AndroidManifest.xml')
def approvedHeaderFile = file('src/main/java/com/ml/tblandroidtxt/MainActivity.java')

def editorialSafe4Files = [
        'PROJECT_INSTRUCTION_BIEN_TAP_V5_SAFE_4.txt': 'C57100C45F16FC5A27E56AE17ABE919BE89DA55082A66D060DB504746ED8B717',
        'PROMPT_DAU_CHAT_3_LUOT_V5_SAFE_4.txt': '0B4C02573F46A91528A63262D3E52C655A5C7E31F2ABBBFB01759D38E94F8E81',
        'WORKFLOW_BIEN_TAP_3_LUOT_V5_SAFE_4.txt': '7A434ADE77239DB33AF5A677456D0310AC11DC8391565FC4888236536FF96B5E'
]
def editorialSafe4Root = file('src/main/assets/editorial/v5-safe4')

def verifyEditorialSafe4Pack = tasks.register('verifyEditorialSafe4Pack') {
    group = 'verification'
    description = 'Requires the bundled V5-SAFE.4 workflow pack to match its immutable source hashes.'
    inputs.files(editorialSafe4Files.keySet().collect { new File(editorialSafe4Root, it) })
    doLast {
        editorialSafe4Files.each { name, expected ->
            def source = new File(editorialSafe4Root, name)
            if (!source.isFile()) throw new GradleException("SAFE 4 workflow source is missing: ${source}")
            def actual = java.security.MessageDigest.getInstance('SHA-256').digest(source.bytes)
                    .collect { String.format('%02X', it & 0xff) }.join()
            if (actual != expected) {
                throw new GradleException("SAFE 4 workflow hash mismatch for ${name}. Expected ${expected}, found ${actual}.")
            }
        }
    }
}

def verifyApprovedLogo = tasks.register('verifyApprovedLogo') {
    group = 'verification'
    description = 'Requires every app build to use the approved Translate Books logo.'
    inputs.files(approvedLogoFile, approvedManifestFile, approvedHeaderFile)
    doLast {
        if (!approvedLogoFile.isFile()) {
            throw new GradleException("Approved logo is missing: ${approvedLogoFile}")
        }
        def digest = java.security.MessageDigest.getInstance('SHA-256').digest(approvedLogoFile.bytes)
        def actualSha256 = digest.collect { String.format('%02X', it & 0xff) }.join()
        if (actualSha256 != approvedLogoSha256) {
            throw new GradleException(
                "Approved logo hash mismatch. Expected ${approvedLogoSha256}, found ${actualSha256}."
            )
        }
        def manifestText = approvedManifestFile.getText('UTF-8')
        if (!manifestText.contains('android:icon="@drawable/translate_books_logo"')
                || !manifestText.contains('android:roundIcon="@drawable/translate_books_logo"')) {
            throw new GradleException('AndroidManifest.xml must use the approved logo for icon and roundIcon.')
        }
        def headerText = approvedHeaderFile.getText('UTF-8')
        if (!headerText.contains('setImageResource(R.drawable.translate_books_logo)')) {
            throw new GradleException('The in-app top brand badge must use the approved logo.')
        }
    }
}

tasks.named('preBuild').configure {
    dependsOn verifyApprovedLogo
    dependsOn verifyEditorialSafe4Pack
}
