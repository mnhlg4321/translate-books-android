plugins {
    id 'java-library'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.register('replayP6WireResponse', JavaExec) {
    group = 'verification'
    description = 'Replay one archived P6 L1 response through the production parser without network access.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.ml.tblandroidtxt.editorial.pack.EditorialWireReplayTool'
    doFirst {
        def phase = providers.gradleProperty('p6ReplayPhase').orNull
        def response = providers.gradleProperty('p6ReplayResponse').orNull
        def raw = providers.gradleProperty('p6ReplayRaw').orNull
        if (phase == 'L1_RAW_DISCOVERY' && response && raw) {
            args phase, response, raw
        } else if (phase == 'L1_RECONCILE' && response && raw
                && providers.gradleProperty('p6ReplayDraft').orNull
                && providers.gradleProperty('p6ReplayRawResponse').orNull) {
            args phase, response, raw,
                    providers.gradleProperty('p6ReplayDraft').get(),
                    providers.gradleProperty('p6ReplayRawResponse').get()
        } else {
            throw new GradleException('Provide p6ReplayPhase, p6ReplayResponse, p6ReplayRaw and phase-specific replay inputs.')
        }
    }
}

tasks.register('replayP6WireResponsesAll', JavaExec) {
    group = 'verification'
    description = 'Replay saved P6 responses from an explicit hash-bound manifest without network access.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.ml.tblandroidtxt.editorial.pack.EditorialWireReplayTool'
    doFirst {
        def manifest = providers.gradleProperty('p6ReplayManifest').orNull
        if (manifest) {
            args 'replay-all', manifest
            return
        }
        def oldRawResponse = providers.gradleProperty('p6ReplayOldRawResponse').orNull
        def currentRawResponse = providers.gradleProperty('p6ReplayCurrentRawResponse').orNull
        def reconcileResponse = providers.gradleProperty('p6ReplayReconcileResponse').orNull
        def raw = providers.gradleProperty('p6ReplayRaw').orNull
        def draft = providers.gradleProperty('p6ReplayDraft').orNull
        if (oldRawResponse && currentRawResponse && reconcileResponse && raw && draft) {
            // Legacy arguments remain accepted for callers that have not migrated, but they are explicitly
            // expectation-free diagnostic mode; use p6ReplayManifest for PASS/EXPECTED_REJECT gates.
            args 'replay-all', oldRawResponse, currentRawResponse, reconcileResponse, raw, draft
        } else {
            throw new GradleException('Provide p6ReplayManifest, or the legacy response/raw/draft paths.')
        }
    }
}

tasks.register('mutateP6WireResponses', JavaExec) {
    group = 'verification'
    description = 'Z2: derive bookkeeping and semantic variants from saved live L1 responses and check the production parser (offline).'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.ml.tblandroidtxt.editorial.pack.EditorialWireMutationTool'
    doFirst {
        def raw = providers.gradleProperty('p6MutRaw').orNull
        def draft = providers.gradleProperty('p6MutDraft').orNull
        def pairs = providers.gradleProperty('p6MutPairs').orNull
        if (!raw || !draft || !pairs) {
            throw new GradleException('Provide p6MutRaw, p6MutDraft and p6MutPairs (comma separated rawResponse,reconcileResponse,...).')
        }
        args([raw, draft] + pairs.split(',').toList())
    }
}
